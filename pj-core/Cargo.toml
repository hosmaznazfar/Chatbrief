[package]
name = "pj"
version = "0.1.0"
edition = "2021"
description = "Safe, language-independent project workflow CLI"
license = "MIT"

[[bin]]
name = "pj"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
